<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f4f5f0">
    <title>My bookings | Parkside</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body data-page="my-bookings">
    <div class="app-shell">
        <aside class="sidebar">
            <a class="brand" href="index.html"><span class="brand-mark">P</span><span><strong>Parkside</strong><small>CAMPUS MOBILITY</small></span></a>
            <nav class="side-nav" aria-label="Main navigation">
                <span class="nav-caption">WORKSPACE</span>
                <a class="nav-link" data-nav="dashboard" href="index.html"><span class="nav-symbol">⌂</span>Overview</a>
                <a class="nav-link" data-nav="parking" href="parking.html"><span class="nav-symbol">▦</span>Find parking</a>
                <a class="nav-link" data-nav="booking" href="booking.html"><span class="nav-symbol">＋</span>Book a space</a>
                <a class="nav-link" data-nav="my-bookings" href="my-bookings.html"><span class="nav-symbol">▤</span>My bookings</a>
                <span class="nav-caption nav-caption-lower">MANAGEMENT</span>
                <a class="nav-link" data-nav="admin" href="admin.html"><span class="nav-symbol">◫</span>Admin dashboard</a>
            </nav>
            <div class="sidebar-bottom"><div class="sidebar-profile"><span class="profile-avatar" data-profile-initial>G</span><span class="profile-copy"><strong data-profile-name>Guest</strong><small data-profile-role>Campus visitor</small></span></div><button class="text-button sign-out" data-logout type="button">Sign out</button></div>
        </aside>
        <main class="main-panel">
            <header class="topbar"><div class="breadcrumb">Workspace <span>/</span> My bookings</div><div class="topbar-actions"><span class="live-pill"><i></i> Live availability</span><a class="topbar-avatar" data-profile-initial href="login.html" aria-label="Sign in">G</a></div></header>
            <div class="page-content">
                <div class="page-heading heading-row"><div><p class="eyebrow">YOUR PARKING</p><h1>My bookings</h1><p class="muted">Your upcoming spaces, all in one place.</p></div><a class="button button-primary" href="booking.html">New booking <span>→</span></a></div>
                <div class="tabs-row"><button class="tab-button is-selected" data-booking-filter="upcoming" type="button">Upcoming <span id="upcoming-count">0</span></button><button class="tab-button" data-booking-filter="past" type="button">Past & cancelled</button></div>
                <section id="my-bookings-list" class="booking-list" aria-live="polite"></section>
                <div class="page-note" id="page-note" role="status"></div>
            </div>
        </main>
    </div>
</body>
</html>
