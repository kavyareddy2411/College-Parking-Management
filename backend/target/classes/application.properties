spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/parkingdb}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:12341234}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
app.demo.student-password=${DEMO_STUDENT_PASSWORD:student123}
app.demo.admin-password=${DEMO_ADMIN_PASSWORD:admin123}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax